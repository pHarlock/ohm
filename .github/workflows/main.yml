name: Build OpenHardwareMonitorLib DLL Only

on: [push, workflow_dispatch]

jobs:
  build-dll:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Library Only
      run: msbuild OpenHardwareMonitorLib.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworkVersion=v4.8

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenHardwareMonitorLib-DLL
        path: "**/OpenHardwareMonitorLib.dll"
