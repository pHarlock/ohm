name: Build OpenHardwareMonitorLib DLL Only

on: [push, workflow_dispatch]

jobs:
  build-dll:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Full Solution
      run: msbuild OpenHardwareMonitor.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenHardwareMonitorLib-DLL
        path: "**/OpenHardwareMonitorLib.dll"
